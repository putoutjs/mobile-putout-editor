name: CI

permissions:
  contents: read

on:
  - push
  - pull_request

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          no-cache: true
          bun-version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - run: bun install
      - name: No raw try/catch in new code
        run: '! grep -rnE "\btry *\{|\} *catch *(\(|\{)|\.catch\(|\bfinally *\{" src test e2e config/shims'
      - name: Unit tests with 100% coverage gate
        run: bun run coverage

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          no-cache: true
          bun-version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - run: bun install
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browsers and deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - name: Install Playwright system deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      - name: Build with coverage instrumentation
        run: bun run build:e2e
      - name: e2e tests
        run: bun run test:e2e
      - name: e2e coverage gate
        run: bun run report:e2e
      - name: Upload test results on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14
